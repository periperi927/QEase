services:
  - type: web
    name: qease
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts && npm run rebuild --prefix node_modules/sqlite3
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: QEASE_ADMIN_USERNAME
        value: admin
      - key: QEASE_ADMIN_PASSWORD
        generateValue: true
